name: F1 Race Week post

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC (9am ET summer / 8am ET winter)
  workflow_dispatch:
    inputs:
      test:
        description: "Post a [TEST] version of the next round now"
        type: boolean
        default: true

defaults:
  run:
    working-directory: f1-slackbot

jobs:
  race-week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: f1-slackbot/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Post race week
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python bot.py race-week ${{ inputs.test && '--test' || '' }}
